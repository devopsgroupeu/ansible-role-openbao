---
- name: Validate configuration variables
  ansible.builtin.include_tasks: validate.yml
  tags: always

- name: Derive cluster address facts
  ansible.builtin.include_tasks: facts.yml
  tags: always

- name: Install OpenBao
  ansible.builtin.include_tasks: install.yml
  when: not openbao_config_only | bool
  tags: install

- name: Render configuration
  ansible.builtin.include_tasks: config.yml
  tags: config

- name: Configure TLS
  ansible.builtin.include_tasks: tls.yml
  tags: tls

- name: Manage the OpenBao service
  ansible.builtin.include_tasks: service.yml
  when: not openbao_config_only | bool
  tags: service

# Run pending handlers (certificate reload) before any API call. Tagged
# always: an untagged flush is skipped under --tags (for example
# --tags tls,init_unseal), and the probes would then see the old certificate.
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  when: not openbao_config_only | bool
  tags: always

# A stopped service (maintenance) is neither initialized nor unsealed.
- name: Initialize and unseal OpenBao
  ansible.builtin.include_tasks: init_unseal.yml
  when:
    - not openbao_config_only | bool
    - openbao_service_state == 'started'
  tags: init_unseal

# Health-gated rolling restart of the nodes with a pending restart marker or
# a running version other than openbao_version.
- name: Restart OpenBao nodes one at a time
  ansible.builtin.include_tasks: restart.yml
  when:
    - not openbao_config_only | bool
    - openbao_service_state == 'started'
  tags: restart
