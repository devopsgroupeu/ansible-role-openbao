---
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual runs from the Actions tab. No inputs: every scenario always runs.
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint --profile production .

  molecule:
    name: molecule / ${{ matrix.scenario }} / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      # Every scenario runs on every push and pull request, raft-ha included
      # (three systemd containers fit a standard runner). Only the default
      # smoke test runs on every supported distribution: rockylinux9 covers
      # the EL 9 package path (dnf, yum_repository, rpm_key). semanage,
      # restorecon and update-ca-trust stay lint-only (SELinux is off in the
      # container and the scenario does not touch the trust store). The
      # other scenarios test behaviour that does not depend on the
      # distribution and run once, on debian12.
      matrix:
        include:
          # render - offline template rendering and the fail-closed input checks
          - scenario: render
            distro: debian12
          # default - signed package install, generated TLS, init, unseal,
          # idempotence, check mode, audit device and logrotate
          - scenario: default
            distro: debian12
          - scenario: default
            distro: ubuntu2404
          - scenario: default
            distro: debian13
          - scenario: default
            distro: rockylinux9
          # day2 - audit device off and on, root token revoked, certificate
          # and key rotation, maintenance stop, --check and --tags
          - scenario: day2
            distro: debian12
          # negative - in-place change guards, restart without unseal keys,
          # foreign data directory, re-init refusal
          - scenario: negative
            distro: debian12
          # autounseal - verified binary install, static seal, KMS plugin install
          - scenario: autounseal
            distro: debian12
          # raft-ha - three nodes: upgrade, rolling restart, quorum check,
          # node replacement
          - scenario: raft-ha
            distro: debian12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Molecule scenario
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}

  ci-success:
    # The single required status check for branch protection.
    name: ci-success
    runs-on: ubuntu-latest
    needs: [lint, molecule]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job (lint or molecule) did not succeed."
          exit 1
      - name: Confirm required jobs passed
        run: echo "lint + molecule succeeded"
