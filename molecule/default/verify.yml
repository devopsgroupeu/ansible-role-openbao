---
# Verify for the default scenario, the smoke test that CI runs on every
# supported distribution. The first play checks the converge result: package
# install with the pinned version and hold, the verified signing key,
# generated TLS, owners and modes of spec section 7.1, the hardened unit and
# the running, initialized and unsealed service, and that the check step
# (converge.yml with --check) restarted nothing. The second play checks the
# encrypted init output on the controller, the declarative audit device and
# that no secret leaks into openbao.hcl or the journal, using the root token
# from the init file. The last play forces a logrotate run.
# The day-2 operations and the fail-closed guards of spec section 12.2,
# List B, do not depend on the distribution and run once, on debian12, in
# the day2 and negative scenarios.

- name: Verify install and service
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Owner, group and mode of every role-managed path (spec section 7.1)
    # that exists on a Shamir node with generated TLS.
    __verify_paths:
      - path: /etc/openbao
        owner: root
        group: openbao
        mode: "0750"
      - path: /etc/openbao/openbao.hcl
        owner: openbao
        group: openbao
        mode: "0640"
      - path: /etc/openbao/openbao.env
        owner: root
        group: root
        mode: "0600"
      - path: /etc/systemd/system/openbao.service
        owner: root
        group: root
        mode: "0644"
      - path: /etc/logrotate.d/openbao
        owner: root
        group: root
        mode: "0644"
      - path: /opt/openbao/data
        owner: openbao
        group: openbao
        mode: "0750"
      - path: /opt/openbao/audit
        owner: openbao
        group: openbao
        mode: "0750"
      - path: /opt/openbao/tls
        owner: root
        group: openbao
        mode: "0750"
      - path: /opt/openbao/tls/openbao-key.pem
        owner: root
        group: openbao
        mode: "0640"
      - path: /opt/openbao/tls/openbao-cert.pem
        owner: root
        group: root
        mode: "0644"
      - path: /opt/openbao/tls/openbao-ca.pem
        owner: root
        group: root
        mode: "0644"
      - path: /opt/openbao/tls/openbao-ca-key.pem
        owner: root
        group: root
        mode: "0600"
      - path: /usr/local/share/openbao
        owner: root
        group: root
        mode: "0755"
      - path: /usr/local/share/openbao/openbao-signing-key.asc
        owner: root
        group: root
        mode: "0644"
    # Paths that must not exist on a converged Shamir node.
    __verify_absent_paths:
      - /etc/openbao/.ansible-restart-pending
      - /root/.gnupg
      - /opt/openbao/plugins
    # SANs the generated node certificate must carry (spec section 5.6).
    __verify_sans:
      - DNS:openbao.cluster.internal
      - DNS:openbao-default
      - DNS:localhost
      - IP:127.0.0.1
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert openbao.service is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['openbao.service']['state'] == 'running'
          - ansible_facts['services']['openbao.service']['status'] == 'enabled'
        fail_msg: "{{ ansible_facts['services']['openbao.service'] | default('openbao.service not found') | to_json }}"
        success_msg: openbao.service is running and enabled

    # side_effect.yml recorded the InvocationID right before Molecule's check
    # step (converge.yml with --check), spec section 10.
    - name: Read the InvocationID of openbao.service
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_invocation_id
      changed_when: false

    - name: Assert check mode restarted nothing
      ansible.builtin.assert:
        that:
          - __verify_invocation_id['stdout'] == __verify_recorded_invocation_id
        fail_msg: >-
          InvocationID changed from {{ __verify_recorded_invocation_id }} to
          {{ __verify_invocation_id['stdout'] }}: the check step restarted openbao.service
        success_msg: the InvocationID recorded before the check step is unchanged
      vars:
        __verify_recorded_invocation_id: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/invocation-id') }}"

    - name: Read the bao version
      ansible.builtin.command: bao version
      register: __verify_version
      changed_when: false

    - name: Assert the pinned version is installed
      ansible.builtin.assert:
        that:
          - "'OpenBao v2.7.3' in __verify_version['stdout']"
        fail_msg: "{{ __verify_version['stdout'] }}"
        success_msg: bao reports OpenBao v2.7.3

    - name: Read the dpkg selection of the openbao package
      ansible.builtin.command: dpkg --get-selections openbao
      register: __verify_selection
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Assert the openbao package is held
      ansible.builtin.assert:
        that:
          - __verify_selection['stdout'].split() | last == 'hold'
        fail_msg: "{{ __verify_selection['stdout'] }}"
        success_msg: openbao is on hold
      when: ansible_facts['os_family'] == 'Debian'

    - name: Stat the role-managed paths
      ansible.builtin.stat:
        path: "{{ item['path'] }}"
      loop: "{{ __verify_paths }}"
      loop_control:
        label: "{{ item['path'] }}"
      register: __verify_path_stats

    - name: Assert owner, group and mode of the role-managed paths
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['pw_name'] == item['item']['owner']
          - item['stat']['gr_name'] == item['item']['group']
          - item['stat']['mode'] == item['item']['mode']
        fail_msg: >-
          {{ item['item']['path'] }}: expected {{ item['item']['owner'] }}:{{ item['item']['group'] }}
          {{ item['item']['mode'] }}, got {{ item['stat']['pw_name'] | default('-') }}:{{ item['stat']['gr_name'] | default('-') }}
          {{ item['stat']['mode'] | default('missing') }}
        success_msg: "{{ item['item']['path'] }} has the expected owner and mode"
      loop: "{{ __verify_path_stats['results'] }}"
      loop_control:
        label: "{{ item['item']['path'] }}"

    - name: Stat the paths that must be absent
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ __verify_absent_paths }}"
      loop_control:
        label: "{{ item }}"
      register: __verify_absent_stats

    - name: Assert the restart marker, /root/.gnupg and the plugin dir are absent
      ansible.builtin.assert:
        that:
          - not item['stat']['exists']
        fail_msg: "{{ item['item'] }} exists"
        success_msg: "{{ item['item'] }} is absent"
      loop: "{{ __verify_absent_stats['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"

    - name: Read the node certificate
      community.crypto.x509_certificate_info:
        path: /opt/openbao/tls/openbao-cert.pem
      register: __verify_cert

    - name: Read the CA certificate
      community.crypto.x509_certificate_info:
        path: /opt/openbao/tls/openbao-ca.pem
      register: __verify_ca

    - name: Assert the node certificate SANs and issuer
      ansible.builtin.assert:
        that:
          - __verify_sans | difference(__verify_cert['subject_alt_name'] | map('regex_replace', '^IP Address:', 'IP:') | list) | length == 0
          - __verify_cert['authority_key_identifier'] == __verify_ca['subject_key_identifier']
        fail_msg: "{{ __verify_cert['subject_alt_name'] | to_json }}"
        success_msg: node certificate carries the required SANs and is signed by the CA

    - name: Read the unit properties of openbao.service
      ansible.builtin.command: systemctl show openbao -p {{ item }} --value  # noqa: command-instead-of-module
      loop:
        - ProtectSystem
        - FragmentPath
      loop_control:
        label: "{{ item }}"
      register: __verify_unit_props
      changed_when: false

    - name: Assert the role unit is loaded with ProtectSystem=strict
      ansible.builtin.assert:
        that:
          - __verify_unit_props['results'][0]['stdout'] == 'strict'
          - __verify_unit_props['results'][1]['stdout'] == '/etc/systemd/system/openbao.service'
        fail_msg: "{{ __verify_unit_props['results'] | map(attribute='stdout') | list | to_json }}"
        success_msg: the role unit at /etc/systemd/system is loaded with ProtectSystem=strict

    - name: Read openbao.hcl
      ansible.builtin.slurp:
        src: /etc/openbao/openbao.hcl
      register: __verify_hcl_raw

    - name: Assert openbao.hcl has no disable_mlock
      ansible.builtin.assert:
        that:
          - "'disable_mlock' not in (__verify_hcl_raw['content'] | b64decode)"
        fail_msg: openbao.hcl contains disable_mlock
        success_msg: openbao.hcl has no disable_mlock

    - name: Read the seal status over TLS
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/seal-status
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 200
      register: __verify_seal
      until: __verify_seal is succeeded
      retries: 12
      delay: 5

    - name: Assert raft storage, the pinned version and an initialized, unsealed Shamir node
      ansible.builtin.assert:
        that:
          - __verify_seal['json']['storage_type'] == 'raft'
          - __verify_seal['json']['version'] == '2.7.3'
          - __verify_seal['json']['initialized']
          - not __verify_seal['json']['sealed']
          - __verify_seal['json']['type'] == 'shamir'
        fail_msg: "{{ __verify_seal['json'] | to_json }}"
        success_msg: node answers over TLS, raft storage, 2.7.3, initialized and unsealed with Shamir

- name: Verify the init output, the audit device and secret handling
  hosts: all
  become: true
  gather_facts: false
  vars:
    __verify_init_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
    __verify_vault_pass: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
    # CLI environment for the token-based checks (verify only; the role never
    # sets BAO_TOKEN).
    __verify_bao_env:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /opt/openbao/tls/openbao-ca.pem
  tasks:
    - name: Stat the controller init file
      ansible.builtin.stat:
        path: "{{ __verify_init_file }}"
      register: __verify_init_stat
      delegate_to: localhost
      become: false

    - name: Assert the init file exists with mode 0600
      ansible.builtin.assert:
        that:
          - __verify_init_stat['stat']['exists']
          - __verify_init_stat['stat']['mode'] == '0600'
        fail_msg: "{{ __verify_init_file }}: {{ __verify_init_stat['stat']['mode'] | default('missing') }}"
        success_msg: the init file exists on the controller with mode 0600

    - name: Read the raw init file
      ansible.builtin.slurp:
        src: "{{ __verify_init_file }}"
      register: __verify_init_raw
      delegate_to: localhost
      become: false

    - name: Assert the init file is Ansible Vault encrypted
      ansible.builtin.assert:
        that:
          - (__verify_init_raw['content'] | b64decode).splitlines() | first == '$ANSIBLE_VAULT;1.2;AES256;filter_default'
        fail_msg: the first line of {{ __verify_init_file }} is not the Ansible Vault 1.2 filter_default header
        success_msg: the init file starts with $ANSIBLE_VAULT;1.2;AES256;filter_default

    # The operator's way to read the file back.
    - name: Decrypt the init file with ansible-vault
      ansible.builtin.command:
        argv:
          - ansible-vault
          - view
          - --vault-password-file
          - "{{ __verify_vault_pass }}"
          - "{{ __verify_init_file }}"
      register: __verify_init_view
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Parse the decrypted init output
      ansible.builtin.set_fact:
        __verify_init: "{{ __verify_init_view['stdout'] | from_json }}"
      no_log: true

    - name: Assert the init output holds a root token and one unseal key
      ansible.builtin.assert:
        that:
          - __verify_init['root_token'] | default('') | length > 0
          - __verify_init['unseal_keys_hex'] | default([], true) | length == 1
        fail_msg: "init output keys: {{ __verify_init | list | to_json }}"
        success_msg: the init output decrypts to JSON with a root token and one unseal key

    - name: List the audit devices with the root token
      ansible.builtin.command: bao audit list -format=json
      environment: "{{ __verify_bao_env | combine({'BAO_TOKEN': __verify_init['root_token']}) }}"
      register: __verify_audit_list
      changed_when: false
      no_log: true

    - name: Assert the declarative file audit device is enabled
      ansible.builtin.assert:
        that:
          - "'file/' in (__verify_audit_list['stdout'] | from_json)"
        fail_msg: "{{ __verify_audit_list['stdout'] }}"
        success_msg: audit device file/ is enabled

    - name: List the raft peers with the root token
      ansible.builtin.command: bao operator raft list-peers -format=json
      environment: "{{ __verify_bao_env | combine({'BAO_TOKEN': __verify_init['root_token']}) }}"
      register: __verify_raft_peers
      changed_when: false
      no_log: true

    - name: Assert one raft voter
      ansible.builtin.assert:
        that:
          - __verify_servers | length == 1
          - __verify_servers | selectattr('voter') | list | length == 1
        fail_msg: "{{ __verify_servers | to_json }}"
        success_msg: raft has one peer and it is a voter
      vars:
        __verify_servers: "{{ (__verify_raft_peers['stdout'] | from_json)['data']['config']['servers'] }}"

    # One more authenticated request, so the audit log has entries.
    - name: Look up the root token
      ansible.builtin.command: bao token lookup -format=json
      environment: "{{ __verify_bao_env | combine({'BAO_TOKEN': __verify_init['root_token']}) }}"
      changed_when: false
      no_log: true

    - name: Stat the audit log
      ansible.builtin.stat:
        path: /opt/openbao/audit/openbao_audit.log
      register: __verify_audit_log

    - name: Assert the audit log is written with mode 0600
      ansible.builtin.assert:
        that:
          - __verify_audit_log['stat']['exists']
          - __verify_audit_log['stat']['size'] > 0
          - __verify_audit_log['stat']['mode'] == '0600'
          - __verify_audit_log['stat']['pw_name'] == 'openbao'
        fail_msg: "{{ __verify_audit_log['stat'] | to_json }}"
        success_msg: the audit log exists, is non-empty and has mode 0600

    - name: Read openbao.hcl for the secret check
      ansible.builtin.slurp:
        src: /etc/openbao/openbao.hcl
      register: __verify_hcl_secret_raw

    - name: Read the openbao journal
      ansible.builtin.command: journalctl -u openbao --no-pager
      register: __verify_journal
      changed_when: false

    - name: Assert neither the root token nor the unseal key appear in openbao.hcl or the journal
      ansible.builtin.assert:
        that:
          - __verify_init['root_token'] not in __verify_hcl_text
          - __verify_init['unseal_keys_hex'][0] not in __verify_hcl_text
          - __verify_init['unseal_keys_b64'][0] not in __verify_hcl_text
          - __verify_init['root_token'] not in __verify_journal['stdout']
          - __verify_init['unseal_keys_hex'][0] not in __verify_journal['stdout']
          - __verify_init['unseal_keys_b64'][0] not in __verify_journal['stdout']
        fail_msg: a secret from the init output appears in openbao.hcl or in journalctl -u openbao
        success_msg: no root token or unseal key in openbao.hcl or the journal
      vars:
        __verify_hcl_text: "{{ __verify_hcl_secret_raw['content'] | b64decode }}"

# The logrotate rule rotates the audit log and its postrotate reload (SIGHUP)
# makes the file audit device re-open a new file (spec section 7.5).
- name: Logrotate
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Force a rotation of the audit log
      ansible.builtin.command: logrotate --force /etc/logrotate.d/openbao
      changed_when: true

    - name: Stat the rotated audit log
      ansible.builtin.stat:
        path: /opt/openbao/audit/openbao_audit.log.1
      register: __verify_rotated_log

    - name: Assert the audit log was rotated
      ansible.builtin.assert:
        that:
          - __verify_rotated_log['stat']['exists']
          - __verify_rotated_log['stat']['size'] > 0
        fail_msg: "{{ __verify_rotated_log['stat'] | to_json }}"
        success_msg: openbao_audit.log.1 exists and is non-empty

    # The device creates the new file when it re-opens on the reload.
    - name: Wait for the new audit log
      ansible.builtin.wait_for:
        path: /opt/openbao/audit/openbao_audit.log
        timeout: 60

    # A request with an invalid token is audited too (as a permission denied
    # error), so the check needs no token.
    - name: Send one audited API request
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/auth/token/lookup-self
        headers:
          X-Vault-Token: molecule-invalid-token
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 403

    - name: Stat the new audit log
      ansible.builtin.stat:
        path: /opt/openbao/audit/openbao_audit.log
      register: __verify_new_audit_log
      until: __verify_new_audit_log['stat']['size'] | default(0) > 0
      retries: 10
      delay: 2

    - name: Assert the new audit log receives entries
      ansible.builtin.assert:
        that:
          - __verify_new_audit_log['stat']['exists']
          - __verify_new_audit_log['stat']['size'] > 0
          - __verify_new_audit_log['stat']['mode'] == '0600'
        fail_msg: "{{ __verify_new_audit_log['stat'] | to_json }}"
        success_msg: the new openbao_audit.log is written with mode 0600

    - name: Gather service facts after the rotation
      ansible.builtin.service_facts:

    - name: Assert openbao.service is still running
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['openbao.service']['state'] == 'running'
        fail_msg: "{{ ansible_facts['services']['openbao.service'] | to_json }}"
        success_msg: openbao.service is still running after the rotation
