---
# Single node, full install from the signed package repository: generated
# TLS, hardened unit, service start, init and unseal, then the day-2 checks
# (check mode, logrotate, certificate rotation, maintenance stop, in-place
# change guards, re-init refusal) of spec section 12.2, List B.
# Run with: molecule test -s default (MOLECULE_DISTRO=ubuntu2404 or debian13
# for the other Debian-family images).

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: openbao-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - openbao

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # Run without top-level fact variables (the ansible-core 2.24 default) to
    # prove the role only reads ansible_facts.
    ANSIBLE_INJECT_FACT_VARS: "False"
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
      stdout_callback: default
    ssh_connection:
      pipelining: false
  inventory:
    hosts:
      all:
        vars:
          ansible_user: root

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    # side_effect records the InvocationID; check runs converge.yml with
    # --check; verify asserts the InvocationID is unchanged (spec section 10).
    - side_effect
    - check
    - verify
    - cleanup
    - destroy
