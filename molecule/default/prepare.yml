---
# Prepare the default container before the role runs: bootstrap Python and
# gather facts. The role installs OpenBao itself from the package repository.
# Also creates the controller-side test files in the Molecule ephemeral
# directory (spec section 12.1), which Molecule prunes after every full
# sequence. force: false keeps the values stable across converge,
# idempotence and verify.

- name: Prepare default container
  hosts: all
  gather_facts: false
  tasks:
    - name: Detect available package manager
      ansible.builtin.raw: command -v apt-get >/dev/null 2>&1 && echo apt || echo dnf
      register: __verify_pkg_mgr
      changed_when: false

    - name: Bootstrap Python (Debian/Ubuntu)
      ansible.builtin.raw: >-
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends python3 python3-apt
      changed_when: true
      when: "'apt' in __verify_pkg_mgr['stdout']"

    - name: Bootstrap Python (RHEL/Rocky)
      ansible.builtin.raw: >-
        dnf install -y python3
      changed_when: true
      when: "'dnf' in __verify_pkg_mgr['stdout']"

    - name: Gather facts after bootstrap
      ansible.builtin.setup:

    # The throwaway Ansible Vault password for the init output, and a second,
    # different one for the "wrong password" case.
    - name: Create the controller-side Ansible Vault password files
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
        dest: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/{{ item }}"
        force: false
        mode: "0600"
      loop:
        - vault-pass.txt
        - wrong-pass.txt
      loop_control:
        label: "{{ item }}"
      run_once: true
      delegate_to: localhost
      become: false
