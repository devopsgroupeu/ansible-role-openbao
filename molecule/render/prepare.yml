---
# Prepare the render container without installing OpenBao.
# Creates what the skipped install stage would create: the openbao system
# group and user, the TLS directory and placeholder certificate, key and CA
# files with the owners and modes of a real install, so config.yml can render
# openbao.hcl with the default BYO TLS paths.

- name: Prepare render container
  hosts: all
  gather_facts: false
  tasks:
    - name: Detect available package manager
      ansible.builtin.raw: command -v apt-get >/dev/null 2>&1 && echo apt || echo dnf
      register: __verify_pkg_mgr
      changed_when: false

    - name: Install minimal dependencies (Debian/Ubuntu)
      ansible.builtin.raw: >-
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends python3 python3-apt passwd procps
      changed_when: true
      when: "'apt' in __verify_pkg_mgr['stdout']"

    - name: Install minimal dependencies (RHEL/Rocky)
      ansible.builtin.raw: >-
        dnf install -y python3 passwd procps-ng
      changed_when: true
      when: "'dnf' in __verify_pkg_mgr['stdout']"

    - name: Gather facts after bootstrap
      ansible.builtin.setup:

    - name: Create openbao system group
      ansible.builtin.group:
        name: openbao
        system: true
        state: present

    - name: Create openbao system user
      ansible.builtin.user:
        name: openbao
        group: openbao
        system: true
        shell: /bin/false
        create_home: false
        state: present

    - name: Create OpenBao TLS directory for placeholder files
      ansible.builtin.file:
        path: /opt/openbao/tls
        state: directory
        owner: root
        group: openbao
        mode: "0750"

    - name: Create placeholder TLS certificate file
      ansible.builtin.copy:
        content: "# placeholder - a real install supplies this file\n"
        dest: /opt/openbao/tls/openbao-cert.pem
        owner: root
        group: root
        mode: "0644"

    - name: Create placeholder TLS key file
      ansible.builtin.copy:
        content: "# placeholder - a real install supplies this file\n"
        dest: /opt/openbao/tls/openbao-key.pem
        owner: root
        group: openbao
        mode: "0640"

    - name: Create placeholder CA file
      ansible.builtin.copy:
        content: "# placeholder - a real install supplies this file\n"
        dest: /opt/openbao/tls/openbao-ca.pem
        owner: root
        group: root
        mode: "0644"
