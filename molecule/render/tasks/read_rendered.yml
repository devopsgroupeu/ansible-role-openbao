---
# Read the rendered files into __verify_* facts for the string assertions of
# verify.yml. __verify_hcl_n and __verify_audit_n have runs of spaces collapsed
# to one, so the assertions do not depend on the column alignment of the
# template. __verify_leaders lists the retry_join leader_api_addr values in
# file order.

- name: Read the rendered config, env file and unit
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/openbao/openbao.hcl
    - /etc/openbao/openbao.env
    - /etc/systemd/system/openbao.service
  register: __verify_slurp

- name: Decode the rendered files
  ansible.builtin.set_fact:
    __verify_hcl: "{{ __verify_slurp['results'][0]['content'] | b64decode }}"
    __verify_env: "{{ __verify_slurp['results'][1]['content'] | b64decode }}"
    __verify_unit: "{{ __verify_slurp['results'][2]['content'] | b64decode }}"

- name: Derive the views used by the assertions
  ansible.builtin.set_fact:
    __verify_hcl_n: "{{ __verify_hcl | regex_replace(' +', ' ') }}"
    __verify_hcl_lines: "{{ __verify_hcl.splitlines() }}"
    __verify_env_lines: "{{ __verify_env.splitlines() }}"
    __verify_unit_lines: "{{ __verify_unit.splitlines() }}"
    __verify_leaders: >-
      {{ __verify_hcl | regex_findall('leader_api_addr\s*=\s*"([^"]*)"') }}
    __verify_audit_n: >-
      {{ (__verify_hcl
          | regex_search('(?s)# BEGIN ANSIBLE MANAGED AUDIT DEVICE\n(.*)# END ANSIBLE MANAGED AUDIT DEVICE', '\1')
          | default([''], true) | first) | regex_replace(' +', ' ') }}

- name: Check for the logrotate rule
  ansible.builtin.stat:
    path: /etc/logrotate.d/openbao
  register: __verify_logrotate
