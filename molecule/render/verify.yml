- name: Negative - unverified binary download
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the role with the binary method, no GPG check and no checksum
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_config_only: true
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_install_method: binary
            openbao_binary_verify_gpg: false

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'Unverified binary download refused.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

