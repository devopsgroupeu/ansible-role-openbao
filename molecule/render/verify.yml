---
# Verify for the offline render scenario.
# Negative cases: one play per fail-closed validation. Each play includes the
# role inside block/rescue with the converge vars (plays do not inherit them)
# plus the case override, and asserts the static headline sentence of the
# expected failure message. A case whose guard does not fire reaches the
# "Fail because the role did not fail" task, and the rescue assert reports it.

- name: Negative - no password file
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the role with encryption requested but no password file
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_config_only: false
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_init_encrypt_password_file: ""

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'Init output encryption requested but no password file set.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

- name: Negative - threshold greater than shares
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the role with a key threshold above the share count
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_config_only: true
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_init_key_shares: 1
            openbao_init_key_threshold: 2

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'Invalid Shamir or recovery share settings.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

- name: Negative - unsupported seal type
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        # rolespec_validate: false skips the automatic argument spec check,
        # whose 'choices' would reject pkcs11 first. This proves that
        # validate.yml still refuses the value for consumers who disable
        # argument validation.
        - name: Include the role with an unsupported seal type
          ansible.builtin.include_role:
            name: ansible-role-openbao
            rolespec_validate: false
          vars:
            openbao_config_only: true
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_seal_type: pkcs11

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'Unsupported openbao_seal_type.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

