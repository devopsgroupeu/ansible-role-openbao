  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the role with the audit device writing to stdout
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_config_only: true
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_audit_file_path: stdout

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'openbao_audit_file_path must be inside openbao_audit_dir.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

- name: Negative - newline in a secret
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the role with a transit token that contains a newline
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_config_only: true
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_seal_type: transit
            openbao_seal_transit_address: "https://u.example:8200"
            openbao_seal_transit_token: "a\nb"

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'A secret variable contains a newline or NUL character.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

- name: Negative - cluster members missing from the play (--limit guard)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        # openbao-node-2 and openbao-node-3 are not in this play and no
        # explicit retry_join addresses are set: facts.yml must stop the run
        # before anything is installed.
        - name: Include the role outside config-only mode with members missing
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_config_only: false
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_init: false

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'Cluster members are missing from this play.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

- name: Negative - BYO TLS file missing
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the role with a BYO certificate path that does not exist
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_config_only: true
            openbao_raft_peers:
              - openbao-render
              - openbao-node-2
              - openbao-node-3
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_tls_cert_file: /opt/openbao/tls/missing-cert.pem

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'BYO TLS file not found.' in ansible_failed_result['msg']"
              - "'openbao_tls_cert_file' in ansible_failed_result['msg']"
              - "'openbao_tls_key_file' not in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"
