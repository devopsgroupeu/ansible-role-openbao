- name: Render - audit disabled
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include the role with the audit device disabled
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_config_only: true
        openbao_raft_peers:
          - openbao-render
          - openbao-node-2
          - openbao-node-3
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_audit_enabled: false

    - name: Read the rendered files
      ansible.builtin.include_tasks: tasks/read_rendered.yml

    # The audit directory stays writable: the replicated audit table still
    # holds the device when the node unseals with this config.
    - name: Assert markers without a device, no logrotate rule, audit dir still writable
      ansible.builtin.assert:
        that:
          - "'# BEGIN ANSIBLE MANAGED AUDIT DEVICE' in __verify_hcl_lines"
          - "'# END ANSIBLE MANAGED AUDIT DEVICE' in __verify_hcl_lines"
          - "'audit \"' not in __verify_hcl"
          - not __verify_logrotate['stat']['exists']
          - "'ReadWritePaths=/opt/openbao/data /opt/openbao/audit' in __verify_unit_lines"
        fail_msg: "{{ __verify_hcl }}{{ __verify_unit }}"
        success_msg: audit device and logrotate rule are removed, the audit directory stays writable

- name: Render - hardening off, privileged API port
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Directive prefixes of the [H] set (spec section 7.4).
    __verify_hardening_names:
      - ProtectSystem=strict
      - ReadWritePaths=
      - ProtectKernelTunables=
      - ProtectKernelModules=
      - ProtectKernelLogs=
      - ProtectControlGroups=
      - ProtectClock=
      - ProtectHostname=
      - RestrictSUIDSGID=
      - RestrictRealtime=
      - RestrictNamespaces=
      - LockPersonality=
      - RestrictAddressFamilies=
      - SystemCallArchitectures=
      - UMask=
  tasks:
    - name: Include the role without hardening and with the API on port 443
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_config_only: true
        openbao_raft_peers:
          - openbao-render
          - openbao-node-2
          - openbao-node-3
        openbao_api_addr: "https://127.0.0.1:443"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_listen_address: "0.0.0.0:443"
        openbao_systemd_hardening: false

    - name: Read the rendered files
      ansible.builtin.include_tasks: tasks/read_rendered.yml

    - name: Assert ProtectSystem=full, no [H] directive, upstream base kept
      ansible.builtin.assert:
        that:
          - "'ProtectSystem=full' in __verify_unit_lines"
          - __verify_hardening_names | select('in', __verify_unit) | list | length == 0
          - "'MemorySwapMax=0' in __verify_unit_lines"
          - "'NoNewPrivileges=yes' in __verify_unit_lines"
          - "'PrivateTmp=yes' in __verify_unit_lines"
          - "'PrivateDevices=yes' in __verify_unit_lines"
          - "'ProtectHome=read-only' in __verify_unit_lines"
          - "'LimitCORE=0' in __verify_unit_lines"
        fail_msg: "{{ __verify_unit }}"
        success_msg: hardening off keeps only the upstream sandbox

    - name: Assert the bind capability for the privileged port
      ansible.builtin.assert:
        that:
          - "'CapabilityBoundingSet=CAP_NET_BIND_SERVICE' in __verify_unit_lines"
          - "'AmbientCapabilities=CAP_NET_BIND_SERVICE' in __verify_unit_lines"
          - "'address = \"0.0.0.0:443\"' in __verify_hcl_n"
          - __verify_leaders == ['https://openbao-node-2:443', 'https://openbao-node-3:443']
        fail_msg: "{{ __verify_unit }}{{ __verify_hcl }}"
        success_msg: CAP_NET_BIND_SERVICE is granted for port 443

- name: Render - extra dicts and raw HCL
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Raw HCL appended after the audit block.
    __verify_extra_hcl: |
      enable_response_header_hostname = true
      enable_response_header_raft_node_id = true
  tasks:
    - name: Include the role with listener and raft extras and raw HCL
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_config_only: true
        openbao_raft_peers:
          - openbao-render
          - openbao-node-2
          - openbao-node-3
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_cluster_name: render-cluster
        openbao_listener_extra_parameters:
          tls_auto_reload: true
          max_request_size: 33554432
          max_request_duration: "90s"
          x_forwarded_for_authorized_addrs:
            - 10.0.0.0/8
            - 192.168.0.0/16
        openbao_raft_extra_parameters:
          retry_join_as_non_voter: false
          trailing_logs: 20000
          snapshot_interval: "60s"
        openbao_audit_options:
          hmac_accessor: false
          elide_list_responses: "true"
        openbao_extra_config_hcl: "{{ __verify_extra_hcl }}"

    - name: Read the rendered files
      ansible.builtin.include_tasks: tasks/read_rendered.yml

    - name: Assert bool, number, string and list values inside their stanzas
      ansible.builtin.assert:
        that:
          - "'cluster_name = \"render-cluster\"' in __verify_hcl_n"
          - "'tls_auto_reload = true' in __verify_hcl_n"
          - "'max_request_size = 33554432' in __verify_hcl_n"
          - "'max_request_duration = \"90s\"' in __verify_hcl_n"
          - "'x_forwarded_for_authorized_addrs = [\"10.0.0.0/8\", \"192.168.0.0/16\"]' in __verify_hcl_n"
          - "'retry_join_as_non_voter = false' in __verify_hcl_n"
          - "'trailing_logs = 20000' in __verify_hcl_n"
          - "'snapshot_interval = \"60s\"' in __verify_hcl_n"
          - "'elide_list_responses = \"true\"' in __verify_audit_n"
          - "'hmac_accessor = \"false\"' in __verify_audit_n"
          - "__verify_hcl.index('storage \"raft\" {') < __verify_hcl.index('trailing_logs') < __verify_hcl.index('listener \"tcp\" {')"
          - "__verify_hcl_n.index('listener \"tcp\" {') < __verify_hcl_n.index('tls_auto_reload') < __verify_hcl_n.index('cluster_addr = \"')"
        fail_msg: "{{ __verify_hcl }}"
        success_msg: extra parameters are rendered with their types

    - name: Assert the raw HCL follows the closed audit block
      ansible.builtin.assert:
        that:
          - "'# END ANSIBLE MANAGED AUDIT DEVICE' in __verify_hcl_lines"
          - __verify_extra_hcl in __verify_hcl
          - __verify_hcl.index(__verify_extra_hcl) > __verify_hcl.index('# END ANSIBLE MANAGED AUDIT DEVICE')
        fail_msg: "{{ __verify_hcl }}"
        success_msg: raw HCL is appended verbatim after the audit block

# String values are escaped: a quote, a backslash or a line break in an
# inventory value cannot close the string and add a stanza.
- name: Render - quotes and line breaks stay inside HCL strings
  hosts: all
  become: true
  gather_facts: true
  vars:
    __verify_cluster_name: "render \"cluster\" \\ x\ninitialize \"y\" {}"
  tasks:
    - name: Include the role with a cluster name that tries to add a stanza
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_config_only: true
        openbao_raft_peers:
          - openbao-render
          - openbao-node-2
          - openbao-node-3
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_cluster_name: "{{ __verify_cluster_name }}"

    - name: Read the rendered files
      ansible.builtin.include_tasks: tasks/read_rendered.yml

    - name: Assert the value is one escaped string
      ansible.builtin.assert:
        that:
          - __verify_hcl_lines | select('match', 'cluster_name') | list | length == 1
          - __verify_hcl_lines | select('match', 'initialize') | list | length == 0
          - "('cluster_name      = ' ~ (__verify_cluster_name | to_json)) in __verify_hcl_lines"
          - "'\\\\\"cluster\\\\\" \\\\\\\\ x\\\\ninitialize' in __verify_hcl"
        fail_msg: "{{ __verify_hcl }}"
        success_msg: cluster_name is rendered as one JSON-escaped HCL string

- name: Render - BYO TLS permissions are enforced
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Loosen the BYO key the way a careless copy would
      ansible.builtin.file:
        path: /opt/openbao/tls/openbao-key.pem
        owner: root
        group: root
        mode: "0644"

    - name: Include the role with the converge vars
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_config_only: true
        openbao_raft_peers:
          - openbao-render
          - openbao-node-2
          - openbao-node-3
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"

    - name: Stat the BYO key
      ansible.builtin.stat:
        path: /opt/openbao/tls/openbao-key.pem
      register: __verify_byo_key

    - name: Assert the role restored root:openbao 0640 on the key
      ansible.builtin.assert:
        that:
          - __verify_byo_key['stat']['pw_name'] == 'root'
          - __verify_byo_key['stat']['gr_name'] == 'openbao'
          - __verify_byo_key['stat']['mode'] == '0640'
        fail_msg: "{{ __verify_byo_key['stat'] | to_json }}"
        success_msg: BYO key is root:openbao 0640 again

