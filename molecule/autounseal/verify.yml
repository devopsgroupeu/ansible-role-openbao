              - "'KMS plugin checksum mismatch.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

# tasks_from: install_plugin.yml skips validate.yml, so the task file refuses
# an unverified download itself (anti-goal 7).
- name: Negative - unverified KMS plugin download
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the KMS plugin install with neither GPG nor a checksum
          ansible.builtin.include_role:
            name: ansible-role-openbao
            tasks_from: install_plugin.yml
          vars:
            openbao_seal_type: awskms
            openbao_seal_plugin_base_url: file:///srv/openbao-mirror/good
            openbao_binary_verify_gpg: false
            openbao_plugin_dir: /opt/openbao/plugins-unverified

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'Unverified KMS plugin download refused.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

- name: Verify the failed runs left nothing behind
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat the paths the failed runs must not create
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/sbin/bao
        - /opt/openbao/plugins-negative/openbao-plugin-kms-aws_0.1.1
        - /opt/openbao/plugins-unverified
        - /etc/openbao/.ansible-restart-pending
      loop_control:
        label: "{{ item }}"
      register: __verify_negative_stats

    - name: Assert the failed runs installed nothing and left no restart marker
      ansible.builtin.assert:
        that:
          - not item['stat']['exists']
        fail_msg: "{{ item['item'] }} exists"
        success_msg: "{{ item['item'] }} is absent"
      loop: "{{ __verify_negative_stats['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"

    - name: Find leftover scratch directories of the role
      ansible.builtin.find:
        paths: /tmp
        patterns: "ansible.*.openbao-*"
        file_type: directory
      register: __verify_negative_scratch

    - name: Read the InvocationID after the negative plays
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_invocation_negative_after
      changed_when: false

    - name: Record the binary checksum after the negative plays
      ansible.builtin.stat:
        path: /usr/local/bin/bao
        checksum_algorithm: sha1
      register: __verify_bin_negative_after

    - name: Assert the scratch directories are gone and the node is untouched
      ansible.builtin.assert:
        that:
          - __verify_negative_scratch['matched'] == 0
          - __verify_invocation_negative_after['stdout'] == __verify_invocation_negative['stdout']
          - __verify_bin_negative_after['stat']['checksum'] == __verify_bin_negative['stat']['checksum']
        fail_msg: >-
          scratch dirs {{ __verify_negative_scratch['files'] | map(attribute='path') | list | to_json }},
          InvocationID {{ __verify_invocation_negative['stdout'] }} ->
          {{ __verify_invocation_negative_after['stdout'] }}
        success_msg: no scratch directory left, service not restarted, binary unchanged

# The installed signing key is checked on every run; a wrong pin fails before
# anything is downloaded or replaced.
- name: Negative - signing key fingerprint mismatch
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Record the signing key and binary checksums before the run
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha1
      loop:
        - /usr/local/share/openbao/openbao-signing-key.asc
        - /usr/local/bin/bao
      loop_control:
        label: "{{ item }}"
      register: __verify_key_before

    - name: Run the role and expect a failure
      block:
        - name: Include the install stage with a wrong signing key fingerprint
          ansible.builtin.include_role:
            name: ansible-role-openbao
            tasks_from: install.yml
          vars:
            openbao_install_method: binary
            openbao_gpg_key_fingerprint: "0000000000000000000000000000000000000000"

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'OpenBao signing key fingerprint mismatch.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

    - name: Record the signing key and binary checksums after the run
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha1
      loop:
        - /usr/local/share/openbao/openbao-signing-key.asc
        - /usr/local/bin/bao
      loop_control:
        label: "{{ item }}"
      register: __verify_key_after

    - name: Assert the signing key and the binary are unchanged
      ansible.builtin.assert:
        that:
          - __verify_key_after['results'] | map(attribute='stat.checksum') | list == __verify_key_before['results'] | map(attribute='stat.checksum') | list
        fail_msg: >-
          {{ __verify_key_before['results'] | map(attribute='stat.checksum') | list | to_json }} ->
          {{ __verify_key_after['results'] | map(attribute='stat.checksum') | list | to_json }}
        success_msg: the signing key file and /usr/local/bin/bao are byte-identical
