- name: Negative - KMS plugin checksum mismatch
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Run the role and expect a failure
      block:
        - name: Include the KMS plugin install with a wrong pinned checksum
          ansible.builtin.include_role:
            name: ansible-role-openbao
            tasks_from: install_plugin.yml
          vars:
            openbao_seal_type: awskms
            openbao_seal_plugin_base_url: file:///srv/openbao-mirror/good
            openbao_seal_plugin_checksum: "{{ '0' * 64 }}"
            openbao_binary_verify_gpg: false
            openbao_plugin_dir: /opt/openbao/plugins-negative

        - name: Fail because the role did not fail
          ansible.builtin.fail:
