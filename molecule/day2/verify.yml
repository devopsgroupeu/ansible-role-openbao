---
# Verify for the day2 scenario (spec section 12.2, List B, day-2 part). The
# first play reads the root token from the encrypted init file. With that
# token the audit device is disabled (the node must become active again),
# its directory moved and the device enabled again. Then the root token is
# revoked and every later play runs the role without it (Review Focus 2):
# wrong Ansible Vault password, certificate rotation (Review Focus 5), a
# replaced node key, maintenance stop and start (Review Focus 3), check mode
# and --tags through a static roles: entry (static_role.yml as a separate
# ansible-playbook process) and a restart intent that survives a failed
# render. Plays that re-include the role repeat the converge vars (plays do
# not inherit them).

- name: Load the init output
  hosts: all
  become: true
  gather_facts: false
  vars:
    __verify_init_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
    __verify_vault_pass: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
  tasks:
    - name: Decrypt the init file with ansible-vault
      ansible.builtin.command:
        argv:
          - ansible-vault
          - view
          - --vault-password-file
          - "{{ __verify_vault_pass }}"
          - "{{ __verify_init_file }}"
      register: __verify_init_view
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Parse the decrypted init output
      ansible.builtin.set_fact:
        __verify_init: "{{ __verify_init_view['stdout'] | from_json }}"
      no_log: true

    - name: Assert the init output holds a root token
      ansible.builtin.assert:
        that:
          - __verify_init['root_token'] | default('') | length > 0
        fail_msg: "init output keys: {{ __verify_init | list | to_json }}"
        success_msg: the init output decrypts to JSON with a root token

# Disabling the declarative audit device (step 1 of the documented device
# change) with the hardened unit: the restarted node must become active
# again. OpenBao opens every device of the replicated audit table at unseal
# before it removes the ones no longer declared, so the audit directory must
# stay writable (ReadWritePaths). With the device gone, openbao_audit_dir
# moves (review round 2); then the device is enabled again with the converge
# values (a new device with a new HMAC salt, back in the default directory).
- name: Audit device disabled and enabled again
  hosts: all
  become: true
  gather_facts: true
  vars:
    __verify_bao_env:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /opt/openbao/tls/openbao-ca.pem
  tasks:
    - name: Include the role with the audit device disabled
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false
        openbao_audit_enabled: false
        # Fail in one minute instead of five if the node stays standby.
        openbao_restart_health_timeout: 60

    - name: Read the write paths of openbao.service
      ansible.builtin.command: systemctl show openbao -p ReadWritePaths --value  # noqa: command-instead-of-module
      register: __verify_rw_paths
      changed_when: false

    - name: Read sys/health after the audit device was disabled
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 200
      register: __verify_health_audit_off

    - name: List the audit devices after the audit device was disabled
      ansible.builtin.command: bao audit list -format=json
      environment: "{{ __verify_bao_env | combine({'BAO_TOKEN': __verify_init['root_token']}) }}"
      register: __verify_audit_list_off
      changed_when: false
      failed_when: false
      no_log: true

    - name: Assert the node is active and the device is gone
      ansible.builtin.assert:
        that:
          - "'/opt/openbao/audit' in __verify_rw_paths['stdout'].split()"
          - __verify_health_audit_off['json']['initialized']
          - not __verify_health_audit_off['json']['sealed']
          - not __verify_health_audit_off['json']['standby']
          - "'file/' not in __verify_audit_list_off['stdout']"
        fail_msg: >-
          ReadWritePaths {{ __verify_rw_paths['stdout'] }}, health
          {{ __verify_health_audit_off['json'] | to_json }}, audit list
          rc {{ __verify_audit_list_off['rc'] }}: {{ __verify_audit_list_off['stdout'] }}
        success_msg: the node is active again without an audit device and the audit directory stayed writable

    # Second step of the documented directory change: with the device gone
    # (no openbao.hcl declares it) the directory may move; the restarted node
    # opens no stored device and becomes active.
    - name: Include the role with the device gone and a new audit directory
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false
        openbao_audit_enabled: false
        openbao_audit_dir: /opt/openbao/audit-moved
        openbao_restart_health_timeout: 60

    - name: Read the write paths after the audit directory change
      ansible.builtin.command: systemctl show openbao -p ReadWritePaths --value  # noqa: command-instead-of-module
      register: __verify_rw_paths_moved
      changed_when: false

    - name: Read sys/health after the audit directory change
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 200
      register: __verify_health_moved

    - name: Assert the node is active with the new audit directory
      ansible.builtin.assert:
        that:
          - "'/opt/openbao/audit-moved' in __verify_rw_paths_moved['stdout'].split()"
          - "'/opt/openbao/audit' not in __verify_rw_paths_moved['stdout'].split()"
          - not __verify_health_moved['json']['sealed']
          - not __verify_health_moved['json']['standby']
        fail_msg: >-
          ReadWritePaths {{ __verify_rw_paths_moved['stdout'] }}, health
          {{ __verify_health_moved['json'] | to_json }}
        success_msg: the audit directory moved once the device was gone and the node is active

    - name: Include the role with the audit device enabled again
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false

    - name: List the audit devices after the audit device was enabled again
      ansible.builtin.command: bao audit list -format=json
      environment: "{{ __verify_bao_env | combine({'BAO_TOKEN': __verify_init['root_token']}) }}"
      register: __verify_audit_list_on
      changed_when: false
      no_log: true

    - name: Assert the device is back
      ansible.builtin.assert:
        that:
          - "'file/' in (__verify_audit_list_on['stdout'] | from_json)"
        fail_msg: "{{ __verify_audit_list_on['stdout'] }}"
        success_msg: audit device file/ is enabled again

# The docs tell operators to revoke the root token after bootstrap; the role
# must keep converging, unsealing and restarting without it.
- name: Revoke root token
  hosts: all
  become: true
  gather_facts: true
  vars:
    __verify_bao_env:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /opt/openbao/tls/openbao-ca.pem
  tasks:
    - name: Revoke the root token
      ansible.builtin.command: bao token revoke -self
      environment: "{{ __verify_bao_env | combine({'BAO_TOKEN': __verify_init['root_token']}) }}"
      changed_when: true
      no_log: true

    - name: Look up the revoked root token
      ansible.builtin.command: bao token lookup
      environment: "{{ __verify_bao_env | combine({'BAO_TOKEN': __verify_init['root_token']}) }}"
      register: __verify_revoked_lookup
      changed_when: false
      failed_when: false
      no_log: true

    - name: Assert the root token no longer works
      ansible.builtin.assert:
        that:
          - __verify_revoked_lookup['rc'] != 0
        fail_msg: bao token lookup still succeeds with the root token
        success_msg: the root token is revoked

    - name: Include the role without a valid root token
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false

    - name: Read the seal status after the run
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/seal-status
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 200
      register: __verify_seal_after_revoke

    - name: Assert the node is still initialized and unsealed
      ansible.builtin.assert:
        that:
          - __verify_seal_after_revoke['json']['initialized']
          - not __verify_seal_after_revoke['json']['sealed']
        fail_msg: "{{ __verify_seal_after_revoke['json'] | to_json }}"
        success_msg: the role converged without the root token

# A wrong or rotated Ansible Vault password must fail clearly in load_keys.yml
# and change nothing on the node (Review Focus 4).
- name: Negative - wrong vault password
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Record the openbao.hcl checksum before the run
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_before

    - name: Run the role and expect a failure
      block:
        - name: Include the role with the wrong Ansible Vault password file
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_init_key_shares: 1
            openbao_init_key_threshold: 1
            openbao_init_encrypt_output: true
            openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/wrong-pass.txt"
            openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
            openbao_cluster_id: molecule-default
            openbao_tls_generate_certs: true
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_raft_peers:
              - openbao-day2
            openbao_tls_install_ca_to_trust_store: false

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the expected message
          ansible.builtin.assert:
            that:
              - "'Could not decrypt the init file.' in ansible_failed_result['msg']"
            fail_msg: "{{ ansible_failed_result['msg'] }}"

    - name: Record the openbao.hcl checksum after the run
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_after

    - name: Assert openbao.hcl is unchanged
      ansible.builtin.assert:
        that:
          - __verify_hcl_after['stat']['checksum'] == __verify_hcl_before['stat']['checksum']
        fail_msg: openbao.hcl changed during the failed run
        success_msg: openbao.hcl is byte-identical after the failed run

# A new SAN re-issues the node certificate; the reload handler (SIGHUP) makes
# the running process serve it without a restart (Review Focus 5).
- name: Certificate rotation
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Read the InvocationID before the rotation
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_invocation_before
      changed_when: false

    - name: Include the role with a new SAN
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false
        openbao_tls_extra_sans:
          - DNS:rotate1.example

    - name: Read the node certificate file
      community.crypto.x509_certificate_info:
        path: /opt/openbao/tls/openbao-cert.pem
      register: __verify_rotated_cert

    - name: Assert the certificate file carries the new SAN
      ansible.builtin.assert:
        that:
          - "'DNS:rotate1.example' in __verify_rotated_cert['subject_alt_name']"
        fail_msg: "{{ __verify_rotated_cert['subject_alt_name'] | to_json }}"
        success_msg: the node certificate was re-issued with DNS:rotate1.example

    # The reload is asynchronous: wait until the listener serves the new file.
    - name: Read the certificate served on 127.0.0.1:8200
      community.crypto.get_certificate:
        host: 127.0.0.1
        port: 8200
      register: __verify_served_cert
      until: __verify_served_cert['serial_number'] | default(0) == __verify_rotated_cert['serial_number']
      retries: 15
      delay: 2

    - name: Parse the served certificate
      community.crypto.x509_certificate_info:
        content: "{{ __verify_served_cert['cert'] }}"
      register: __verify_served_info

    - name: Read the InvocationID after the rotation
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_invocation_after
      changed_when: false

    - name: Assert the new certificate is served without a restart
      ansible.builtin.assert:
        that:
          - "'DNS:rotate1.example' in __verify_served_info['subject_alt_name']"
          - __verify_invocation_after['stdout'] == __verify_invocation_before['stdout']
        fail_msg: >-
          served SANs {{ __verify_served_info['subject_alt_name'] | to_json }},
          InvocationID {{ __verify_invocation_before['stdout'] }} ->
          {{ __verify_invocation_after['stdout'] }}
        success_msg: the listener serves the new certificate and openbao.service was not restarted

# A node key that is replaced (here deleted, so openssl_privatekey creates a
# new one) must be followed by a re-signed certificate and a reload; else the
# certificate and the key file no longer match and the next restart fails.
- name: Node key replaced
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Read the InvocationID before the key change
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_invocation_before_key
      changed_when: false

    - name: Delete the node private key
      ansible.builtin.file:
        path: /opt/openbao/tls/openbao-key.pem
        state: absent

    - name: Include the role with the SANs of the rotation play
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false
        openbao_tls_extra_sans:
          - DNS:rotate1.example

    - name: Read the new node private key
      community.crypto.openssl_privatekey_info:
        path: /opt/openbao/tls/openbao-key.pem
      register: __verify_new_key

    - name: Read the node certificate file after the key change
      community.crypto.x509_certificate_info:
        path: /opt/openbao/tls/openbao-cert.pem
      register: __verify_key_cert

    - name: Read the certificate served after the key change
      community.crypto.get_certificate:
        host: 127.0.0.1
        port: 8200
      register: __verify_key_served
      until: __verify_key_served['serial_number'] | default(0) == __verify_key_cert['serial_number']
      retries: 15
      delay: 2

    - name: Parse the served certificate after the key change
      community.crypto.x509_certificate_info:
        content: "{{ __verify_key_served['cert'] }}"
      register: __verify_key_served_info

    - name: Read the InvocationID after the key change
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_invocation_after_key
      changed_when: false

    - name: Assert certificate, key and served certificate belong together
      ansible.builtin.assert:
        that:
          - __verify_key_cert['public_key'] == __verify_new_key['public_key']
          - __verify_key_served_info['public_key'] == __verify_new_key['public_key']
          - __verify_invocation_after_key['stdout'] == __verify_invocation_before_key['stdout']
        fail_msg: >-
          certificate file matches key: {{ __verify_key_cert['public_key'] == __verify_new_key['public_key'] }},
          served certificate matches key: {{ __verify_key_served_info['public_key'] == __verify_new_key['public_key'] }},
          InvocationID {{ __verify_invocation_before_key['stdout'] }} ->
          {{ __verify_invocation_after_key['stdout'] }}
        success_msg: the certificate was re-signed for the new key and is served without a restart

# Maintenance stop while a certificate changes: the reload handler must not
# start the stopped unit (Review Focus 3, G1).
- name: Maintenance stop
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include the role with openbao_service_state stopped and another SAN
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false
        openbao_tls_extra_sans:
          - DNS:rotate2.example
        openbao_service_state: stopped

    - name: Read the node certificate file
      community.crypto.x509_certificate_info:
        path: /opt/openbao/tls/openbao-cert.pem
      register: __verify_stopped_cert

    - name: Gather service facts after the maintenance stop
      ansible.builtin.service_facts:

    - name: Assert the certificate changed and the service stayed stopped
      ansible.builtin.assert:
        that:
          - "'DNS:rotate2.example' in __verify_stopped_cert['subject_alt_name']"
          - ansible_facts['services']['openbao.service']['state'] != 'running'
        fail_msg: >-
          SANs {{ __verify_stopped_cert['subject_alt_name'] | to_json }},
          service {{ ansible_facts['services']['openbao.service'] | to_json }}
        success_msg: the certificate was re-issued and openbao.service stayed stopped

- name: Maintenance start
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include the role with openbao_service_state started
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false
        openbao_tls_extra_sans:
          - DNS:rotate2.example
        openbao_service_state: started

    - name: Gather service facts after the maintenance start
      ansible.builtin.service_facts:

    - name: Read the seal status after the maintenance start
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/seal-status
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 200
      register: __verify_seal_after_start

    - name: Assert the service runs and the role unsealed it again
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['openbao.service']['state'] == 'running'
          - __verify_seal_after_start['json']['initialized']
          - not __verify_seal_after_start['json']['sealed']
        fail_msg: >-
          service {{ ansible_facts['services']['openbao.service'] | to_json }},
          seal status {{ __verify_seal_after_start['json'] | to_json }}
        success_msg: openbao.service runs again and is unsealed from the init file

# Check mode and --tags exist only on the command line, so these cases run
# static_role.yml (the role through roles:) as a separate ansible-playbook
# process against the Molecule inventory, with the environment Molecule set.
#   1. --check with a pending config change reports the restart, changes
#      nothing
#   2. --tags tls,init_unseal with a new API address: the certificate reload
#      runs before the API probes need the new SAN; config is not rendered
#   3. --tags restart with a pending restart: only the rolling restart acts
- name: Check mode and tags through a static role entry
  hosts: all
  become: true
  gather_facts: true
  vars:
    __verify_ephemeral: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    __verify_nested_cmd:
      - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
      - -i
      - "{{ __verify_ephemeral }}/inventory"
      - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/static_role.yml"
    __verify_nested_env:
      ANSIBLE_NOCOLOR: "1"
      ANSIBLE_FORCE_COLOR: "0"
      PY_COLORS: "0"
  tasks:
    - name: Read the InvocationID before the check run
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_inv_before_check
      changed_when: false

    - name: Record the openbao.hcl checksum before the check run
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_before_check

    - name: Run the role in check mode with a log level change
      ansible.builtin.command:
        argv: "{{ __verify_nested_cmd + ['--check', '-e', 'openbao_log_level=debug'] }}"
      environment: "{{ __verify_nested_env }}"
      register: __verify_check_run
      changed_when: false
      failed_when: __verify_check_run['rc'] != 0
      delegate_to: localhost
      become: false

    - name: Read the InvocationID after the check run
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_inv_after_check
      changed_when: false

    - name: Record the openbao.hcl checksum after the check run
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_after_check

    - name: Stat the restart marker after the check run
      ansible.builtin.stat:
        path: /etc/openbao/.ansible-restart-pending
      register: __verify_marker_check

    - name: Assert check mode reports the restart and changes nothing
      ansible.builtin.assert:
        that:
          - "'Check mode: would restart openbao-day2' in __verify_check_run['stdout']"
          - __verify_inv_after_check['stdout'] == __verify_inv_before_check['stdout']
          - __verify_hcl_after_check['stat']['checksum'] == __verify_hcl_before_check['stat']['checksum']
          - not __verify_marker_check['stat']['exists']
        fail_msg: >-
          report: {{ __verify_check_run['stdout_lines'] | select('search', 'Check mode') | list | to_json }},
          InvocationID {{ __verify_inv_before_check['stdout'] }} -> {{ __verify_inv_after_check['stdout'] }},
          marker {{ __verify_marker_check['stat']['exists'] }}
        success_msg: check mode reports the pending restart and restarted, rendered and recorded nothing

    - name: Run the TLS and init_unseal stages with the API address 127.0.0.2
      ansible.builtin.command:
        argv: "{{ __verify_nested_cmd + ['--tags', 'tls,init_unseal', '-e', 'openbao_api_addr=https://127.0.0.2:8200'] }}"
      environment: "{{ __verify_nested_env }}"
      register: __verify_tags_tls_run
      changed_when: true
      failed_when: __verify_tags_tls_run['rc'] != 0
      delegate_to: localhost
      become: false

    - name: Read the certificate served on 127.0.0.2
      community.crypto.get_certificate:
        host: 127.0.0.2
        port: 8200
      register: __verify_tags_served

    - name: Parse the certificate served on 127.0.0.2
      community.crypto.x509_certificate_info:
        content: "{{ __verify_tags_served['cert'] }}"
      register: __verify_tags_served_info

    - name: Read the InvocationID after the tagged TLS run
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_inv_after_tls
      changed_when: false

    - name: Record the openbao.hcl checksum after the tagged TLS run
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_after_tls

    - name: Assert the reload ran before the probes and config was skipped
      ansible.builtin.assert:
        that:
          - "'IP:127.0.0.2' in __verify_tags_served_info['subject_alt_name']"
          - __verify_inv_after_tls['stdout'] == __verify_inv_before_check['stdout']
          - __verify_hcl_after_tls['stat']['checksum'] == __verify_hcl_before_check['stat']['checksum']
        fail_msg: >-
          served SANs {{ __verify_tags_served_info['subject_alt_name'] | to_json }},
          InvocationID {{ __verify_inv_before_check['stdout'] }} -> {{ __verify_inv_after_tls['stdout'] }},
          openbao.hcl changed: {{ __verify_hcl_after_tls['stat']['checksum'] != __verify_hcl_before_check['stat']['checksum'] }}
        success_msg: the new certificate was loaded before the probes, without a restart and without rendering openbao.hcl

    - name: Record a pending restart
      ansible.builtin.copy:
        content: "restart pending\n"
        dest: /etc/openbao/.ansible-restart-pending
        owner: root
        group: root
        mode: "0600"

    - name: Run only the restart stage with a log level change
      ansible.builtin.command:
        argv: "{{ __verify_nested_cmd + ['--tags', 'restart', '-e', 'openbao_log_level=debug'] }}"
      environment: "{{ __verify_nested_env }}"
      register: __verify_tags_restart_run
      changed_when: true
      failed_when: __verify_tags_restart_run['rc'] != 0
      delegate_to: localhost
      become: false

    - name: Read the InvocationID after the tagged restart run
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_inv_after_restart
      changed_when: false

    - name: Record the openbao.hcl checksum after the tagged restart run
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_after_restart

    - name: Stat the restart marker after the tagged restart run
      ansible.builtin.stat:
        path: /etc/openbao/.ansible-restart-pending
      register: __verify_marker_restart

    - name: Read the seal status after the tagged restart run
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/seal-status
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 200
      register: __verify_seal_after_tags

    - name: Assert only the rolling restart acted
      ansible.builtin.assert:
        that:
          - __verify_inv_after_restart['stdout'] != __verify_inv_after_tls['stdout']
          - not __verify_marker_restart['stat']['exists']
          - __verify_hcl_after_restart['stat']['checksum'] == __verify_hcl_before_check['stat']['checksum']
          - not __verify_seal_after_tags['json']['sealed']
        fail_msg: >-
          InvocationID {{ __verify_inv_after_tls['stdout'] }} -> {{ __verify_inv_after_restart['stdout'] }},
          marker {{ __verify_marker_restart['stat']['exists'] }},
          openbao.hcl changed: {{ __verify_hcl_after_restart['stat']['checksum'] != __verify_hcl_before_check['stat']['checksum'] }},
          seal status {{ __verify_seal_after_tags['json'] | to_json }}
        success_msg: --tags restart restarted and unsealed the node and rendered nothing

# The restart marker is written before the rendered files change, so a run
# that stops after one render cannot lose the restart: here openbao.env
# changes (permission check off) and then openbao.hcl fails its validate hook
# (an unknown key in openbao_extra_config_hcl). The next run with the
# original values must restart the node.
- name: Restart intent survives a failed render
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Read the InvocationID before the failed render
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_inv_before_render
      changed_when: false

    - name: Record the openbao.hcl checksum before the failed render
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_before_render

    - name: Run the role and expect the openbao.hcl render to fail
      block:
        - name: Include the role with an env change and an invalid extra HCL key
          ansible.builtin.include_role:
            name: ansible-role-openbao
          vars:
            openbao_init_key_shares: 1
            openbao_init_key_threshold: 1
            openbao_init_encrypt_output: true
            openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
            openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
            openbao_cluster_id: molecule-default
            openbao_tls_generate_certs: true
            openbao_api_addr: "https://127.0.0.1:8200"
            openbao_cluster_addr: "https://127.0.0.1:8201"
            openbao_raft_peers:
              - openbao-day2
            openbao_tls_install_ca_to_trust_store: false
            openbao_tls_extra_sans:
              - DNS:rotate2.example
            openbao_enable_file_permissions_check: false
            openbao_extra_config_hcl: "molecule_unknown_key = true"

        - name: Fail because the role did not fail
          ansible.builtin.fail:
            msg: expected failure did not happen
      rescue:
        - name: Assert the openbao.hcl render failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] is search('Render openbao.hcl')
            fail_msg: "{{ ansible_failed_task['name'] }}: {{ ansible_failed_result['msg'] | default('') }}"

    - name: Read openbao.env after the failed render
      ansible.builtin.slurp:
        src: /etc/openbao/openbao.env
      register: __verify_env_after_render

    - name: Stat the restart marker after the failed render
      ansible.builtin.stat:
        path: /etc/openbao/.ansible-restart-pending
      register: __verify_marker_after_render

    - name: Record the openbao.hcl checksum after the failed render
      ansible.builtin.stat:
        path: /etc/openbao/openbao.hcl
        checksum_algorithm: sha1
      register: __verify_hcl_after_render

    - name: Assert openbao.env changed, openbao.hcl did not and the restart is recorded
      ansible.builtin.assert:
        that:
          - "'BAO_ENABLE_FILE_PERMISSIONS_CHECK' not in (__verify_env_after_render['content'] | b64decode)"
          - __verify_hcl_after_render['stat']['checksum'] == __verify_hcl_before_render['stat']['checksum']
          - __verify_marker_after_render['stat']['exists']
        fail_msg: >-
          openbao.hcl changed: {{ __verify_hcl_after_render['stat']['checksum'] != __verify_hcl_before_render['stat']['checksum'] }},
          marker present: {{ __verify_marker_after_render['stat']['exists'] }}
        success_msg: the restart marker was written before the failed render

    - name: Include the role with the original values
      ansible.builtin.include_role:
        name: ansible-role-openbao
      vars:
        openbao_init_key_shares: 1
        openbao_init_key_threshold: 1
        openbao_init_encrypt_output: true
        openbao_init_encrypt_password_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault-pass.txt"
        openbao_init_output_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/openbao_init.json"
        openbao_cluster_id: molecule-default
        openbao_tls_generate_certs: true
        openbao_api_addr: "https://127.0.0.1:8200"
        openbao_cluster_addr: "https://127.0.0.1:8201"
        openbao_raft_peers:
          - openbao-day2
        openbao_tls_install_ca_to_trust_store: false
        openbao_tls_extra_sans:
          - DNS:rotate2.example

    - name: Read the InvocationID after the healing run
      ansible.builtin.command: systemctl show openbao -p InvocationID --value  # noqa: command-instead-of-module
      register: __verify_inv_after_render
      changed_when: false

    - name: Stat the restart marker after the healing run
      ansible.builtin.stat:
        path: /etc/openbao/.ansible-restart-pending
      register: __verify_marker_after_heal

    - name: Read the seal status after the healing run
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/seal-status
        ca_path: /opt/openbao/tls/openbao-ca.pem
        validate_certs: true
        status_code: 200
      register: __verify_seal_after_heal

    - name: Assert the pending restart ran and the unseal keys were cleared
      ansible.builtin.assert:
        that:
          - __verify_inv_after_render['stdout'] != __verify_inv_before_render['stdout']
          - not __verify_marker_after_heal['stat']['exists']
          - not __verify_seal_after_heal['json']['sealed']
          - __openbao_unseal_keys | default([]) | length == 0
          - __openbao_init_file_keys | default([]) | length == 0
          - __openbao_init_file_raw | default({}) | length == 0
        fail_msg: >-
          InvocationID {{ __verify_inv_before_render['stdout'] }} ->
          {{ __verify_inv_after_render['stdout'] }}, marker present:
          {{ __verify_marker_after_heal['stat']['exists'] }}, seal status
          {{ __verify_seal_after_heal['json'] | to_json }}, unseal keys left in
          host variables: {{ __openbao_unseal_keys | default([]) | length }}
        success_msg: the node was restarted once for the recorded change, and no unseal key is left in the host variables
