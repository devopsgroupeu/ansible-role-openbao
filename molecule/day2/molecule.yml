---
# Single node, the converge of the default scenario, then the day-2 cases of
# spec section 12.2, List B: audit device off, moved and on again, root token
# revoked, wrong Ansible Vault password, certificate and key rotation,
# maintenance stop and start, --check and --tags through roles:, restart
# intent after a failed render. The cases do not depend on the distribution,
# so CI runs this scenario on debian12 only. There is no idempotence step:
# the default scenario covers it, and most cases change the node on purpose.
# Run with: molecule test -s day2

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: openbao-day2
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: ""
    groups:
      - openbao

provisioner:
  name: ansible
  playbooks:
    # Same container preparation and controller-side test files as default.
    prepare: ../default/prepare.yml
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # Run without top-level fact variables (the ansible-core 2.24 default) to
    # prove the role only reads ansible_facts.
    ANSIBLE_INJECT_FACT_VARS: "False"
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
      stdout_callback: default
    ssh_connection:
      pipelining: false
  inventory:
    hosts:
      all:
        vars:
          ansible_user: root

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
