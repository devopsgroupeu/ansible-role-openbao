---
galaxy_info:
  author: DevOpsGroup
  company: DevOpsGroup s.r.o
  description: >
    Production-ready Ansible role for OpenBao as a TLS-enabled Raft HA cluster
    with idempotent init and unseal (Shamir, static, transit, cloud KMS),
    declarative audit, health-gated rolling restarts, systemd hardening and
    Prometheus telemetry.

  license: Apache-2.0
  min_ansible_version: "2.19"

  role_name: openbao
  namespace: devopsgroupeu

  galaxy_tags:
    - openbao
    - vault
    - secrets
    - pki
    - raft
    - ha
    - security
    - secretsmanagement
    - keymanagement
    - encryption
    - tls
    - unseal
    - shamir
    - autounseal
    - telemetry

  platforms:
    - name: Ubuntu
      versions:
        - noble
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: EL
      versions:
        - "9"

dependencies: []
