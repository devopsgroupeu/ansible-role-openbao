---
argument_specs:
  main:
    short_description: Install and configure OpenBao as a TLS-enabled Raft HA cluster
    description: >
      Installs OpenBao from the signed package repository or a GPG-verified
      release tarball, renders a validated openbao.hcl (Raft integrated storage,
      TLS on by default, declarative file audit device), initializes and unseals
      the cluster (Shamir, static, transit or cloud KMS plugins) with the init
      output encrypted on the controller, hardens the systemd unit and restarts
      nodes one at a time behind a quorum check and a health gate.
    author:
      - DevOpsGroup
    options:

      # ---- Install ----
      openbao_version:
        type: str
        required: false
        default: "2.7.3"
        description: >
          Exact OpenBao version (X.Y.Z), minimum 2.7.2. A change is an upgrade
          and triggers a rolling restart.

      openbao_install_method:
        type: str
        required: false
        default: "package"
        choices: [package, binary]
        description: >
          Installation method. 'package' uses the signed pkgs.openbao.org
          repository; 'binary' downloads the GPG-verified GitHub release tarball.

      openbao_package_hold:
        type: bool
        required: false
        default: true
        description: >
          Protect the pinned version from unrelated upgrades (dpkg hold on the
          Debian family, repository disabled by default on EL).

      openbao_apt_repo_url:
        type: str
        required: false
        default: "https://pkgs.openbao.org/deb/"
        description: APT repository URL (suite 'stable', component 'main').

      openbao_rpm_repo_baseurl:
        type: str
        required: false
        default: "https://pkgs.openbao.org/rpm/$basearch"
        description: DNF repository base URL.

      openbao_gpg_key_url:
        type: str
        required: false
        default: "https://openbao.org/assets/openbao-gpg-pub-20240618.asc"
        description: >
          Signing key for packages, release checksums and KMS plugins.
          Downloaded only while no verified key is installed.

      openbao_gpg_key_fingerprint:
        type: str
        required: false
        default: "66D15FDD87287219C8E15478D200CD702853E6D0"
        description: >
          Expected primary fingerprint of the signing key. Any other key, and
          any file with more than one key, is refused.

      openbao_binary_base_url:
        type: str
        required: false
        default: "https://github.com/openbao/openbao/releases/download"
        description: Base URL for the binary method ('/v<version>/<asset>' is appended).

      openbao_binary_verify_gpg:
        type: bool
        required: false
        default: true
        description: >
          GPG-verify checksums.txt (binary method) and the KMS plugin archive.
          Set false only together with a pinned checksum.

      openbao_binary_checksum:
        type: str
        required: false
        default: ""
        description: >
          Optional pinned SHA-256 (64 lowercase hex) of the release tarball for
          this host's architecture; set it per architecture through a map.

      openbao_arch:
        type: str
        required: false
        default: "{{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}.get(ansible_facts['architecture'], '') }}"
        description: >
          Upstream architecture name. amd64/arm64 only; other architectures
          resolve to an empty string and are rejected by validate.yml.

      # ---- Paths / users ----
      openbao_config_dir:
        type: str
        required: false
        default: "/etc/openbao"
        description: Directory that holds openbao.hcl and openbao.env.

      openbao_data_dir:
        type: str
        required: false
        default: "/opt/openbao/data"
        description: Raft integrated storage data directory.

      openbao_tls_dir:
        type: str
        required: false
        default: "/opt/openbao/tls"
        description: Directory for TLS material (certificate, key, CA).

      openbao_audit_dir:
        type: str
        required: false
        default: "/opt/openbao/audit"
        description: Audit log directory; the audit file must be inside it.

      openbao_plugin_dir:
        type: str
        required: false
        default: "/opt/openbao/plugins"
        description: External plugin directory; created and configured only for cloud KMS seals.

      openbao_user:
        type: str
        required: false
        default: "openbao"
        description: Service user.

      openbao_group:
        type: str
        required: false
        default: "openbao"
        description: Service group.

      openbao_bin_path:
        type: str
        required: false
        default: "{{ '/usr/local/bin/bao' if openbao_install_method == 'binary' else '/usr/bin/bao' }}"
        description: Path of the bao binary; computed from the install method.

      # ---- Listener / addresses / UI ----
      openbao_listen_address:
        type: str
        required: false
        default: "0.0.0.0:8200"
        description: API listener bind address (host:port).

      openbao_cluster_listen_address:
        type: str
        required: false
        default: "0.0.0.0:8201"
        description: Cluster listener bind address (host:port).

      openbao_api_addr:
        type: str
        required: false
        default: "{{ 'https' if openbao_tls_enabled | bool else 'http' }}://{{ ansible_facts['default_ipv4']['address'] | default(inventory_hostname) }}:{{ openbao_listen_address.split(':') | last }}"
        description: >
          Advertised API URL of this node and the address of the role's own
          probes, so the certificate must cover its host. Falls back to the
          inventory name when the host has no default route.

      openbao_cluster_addr:
        type: str
        required: false
        default: "https://{{ ansible_facts['default_ipv4']['address'] | default(inventory_hostname) }}:{{ openbao_cluster_listen_address.split(':') | last }}"
        description: Advertised cluster URL of this node.

      openbao_ui:
        type: bool
        required: false
        default: true
        description: Enable the web UI.

      openbao_cluster_name:
        type: str
        required: false
        default: ""
        description: Cluster name; empty lets OpenBao generate one.

      openbao_listener_extra_parameters:
        type: dict
        required: false
        default: {}
        description: >
          Extra keys for the API listener stanza (for example
          x_forwarded_for_authorized_addrs, tls_auto_reload). Values are bool,
          number, string, or list of strings.

      # ---- TLS ----
      openbao_tls_enabled:
        type: bool
        required: false
        default: true
        description: >
          Enable TLS on the API listener. False renders tls_disable = true
          (leaving both unset would make OpenBao start ACME).

      openbao_tls_cert_file:
        type: str
        required: false
        default: "{{ openbao_tls_dir }}/openbao-cert.pem"
        description: Server certificate file (BYO TLS requires it on the host).

      openbao_tls_key_file:
        type: str
        required: false
        default: "{{ openbao_tls_dir }}/openbao-key.pem"
        description: Server private key file.

      openbao_tls_ca_file:
        type: str
        required: false
        default: "{{ openbao_tls_dir }}/openbao-ca.pem"
        description: CA bundle used for retry_join and the role's probes.

      openbao_tls_min_version:
        type: str
        required: false
        default: "tls12"
        choices: [tls12, tls13]
        description: Minimum TLS version accepted by the listener.

      openbao_tls_max_version:
        type: str
        required: false
        default: "tls13"
        choices: [tls12, tls13]
        description: Maximum TLS version accepted by the listener.

      openbao_tls_cipher_suites:
        type: str
        required: false
        default: >-
          TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        description: TLS 1.2 cipher suites; rendered only when min and max are both tls12.

      openbao_tls_disable_client_certs:
        type: bool
        required: false
        default: true
        description: Do not request client certificates on the API listener.

      openbao_tls_generate_certs:
        type: bool
        required: false
        default: false
        description: >
          Generate a CA and node certificates with community.crypto. Dev/test
          only, because the CA key is copied to every node.

      openbao_tls_cert_key_type:
        type: str
        required: false
        default: "ECC"
        choices: [ECC, RSA]
        description: Key type of generated certificates.

      openbao_tls_cert_curve:
        type: str
        required: false
        default: "secp384r1"
        description: Curve of generated ECC keys.

      openbao_tls_cert_size:
        type: int
        required: false
        default: 4096
        description: Size of generated RSA keys.

      openbao_tls_cert_validity:
        type: str
        required: false
        default: "+825d"
        description: Validity of generated certificates (ownca_not_after syntax).

      openbao_tls_leader_servername:
        type: str
        required: false
        default: "openbao.cluster.internal"
        description: >
          Shared DNS SAN used as leader_tls_servername in retry_join. BYO
          certificates must contain it.

      openbao_tls_extra_sans:
        type: list
        elements: str
        required: false
        default: []
        description: "Extra SANs for generated certificates, already prefixed (DNS: or IP:)."

      openbao_tls_install_ca_to_trust_store:
        type: bool
        required: false
        default: true
        description: Install the CA into the OS trust store.

      # ---- Storage (Raft) ----
      openbao_raft_node_id:
        type: str
        required: false
        default: "{{ inventory_hostname }}"
        description: Raft node id; the role refuses to change it on a node with raft data.

      openbao_raft_peers:
        type: list
        elements: str
        required: false
        default: "{{ groups['openbao'] | default([inventory_hostname]) }}"
        description: Inventory names of all cluster members.

      openbao_raft_retry_join_api_addrs:
        type: list
        elements: str
        required: false
        default: []
        description: >
          Explicit API URLs of all members for retry_join. Empty uses each
          peer's openbao_api_addr. Required for --limit runs.

      openbao_raft_performance_multiplier:
        type: int
        required: false
        default: 1
        description: Raft timing multiplier (1 is the production value).

      openbao_raft_extra_parameters:
        type: dict
        required: false
        default: {}
        description: >
          Extra keys for the storage "raft" stanza (not checked by
          bao operator validate-config).

      # ---- Seal / auto-unseal ----
      openbao_seal_type:
        type: str
        required: false
        default: "shamir"
        choices: [shamir, static, transit, awskms, azurekeyvault, gcpckms]
        description: >
          Seal type. The cloud seals use external KMS plugins. The role refuses
          to change it on a node with raft data (manual seal migration).

      openbao_seal_static_current_key_id:
        type: str
        required: false
        default: ""
        description: Permanent identifier of the static seal key.

      openbao_seal_static_current_key:
        type: str
        required: false
        default: ""
        no_log: true
        description: >
          Static seal key, 32 random bytes as base64 or hex. Written to
          openbao.env and referenced as env:// in openbao.hcl.

      openbao_seal_transit_address:
        type: str
        required: false
        default: ""
        description: URL of the unsealer OpenBao or Vault.

      openbao_seal_transit_key_name:
        type: str
        required: false
        default: "autounseal"
        description: Transit key name on the unsealer.

      openbao_seal_transit_mount_path:
        type: str
        required: false
        default: "transit/"
        description: Transit mount path on the unsealer.

      openbao_seal_transit_namespace:
        type: str
        required: false
        default: ""
        description: Namespace on the unsealer; empty = omitted.

      openbao_seal_transit_tls_ca_cert:
        type: str
        required: false
        default: ""
        description: Path on the node to the CA certificate of the unsealer.

      openbao_seal_transit_disable_renewal:
        type: bool
        required: false
        default: false
        description: Disable renewal of the transit token.

      openbao_seal_transit_token:
        type: str
        required: false
        default: ""
        no_log: true
        description: Token for the unsealer, written as BAO_TOKEN to openbao.env.

      openbao_seal_awskms_region:
        type: str
        required: false
        default: "us-east-1"
        description: AWS region of the KMS key.

      openbao_seal_awskms_kms_key_id:
        type: str
        required: false
        default: ""
        description: AWS KMS key id or ARN.

      openbao_seal_awskms_access_key:
        type: str
        required: false
        default: ""
        no_log: true
        description: AWS access key; empty uses the instance role.

      openbao_seal_awskms_secret_key:
        type: str
        required: false
        default: ""
        no_log: true
        description: AWS secret key.

      openbao_seal_azurekeyvault_tenant_id:
        type: str
        required: false
        default: ""
        description: Azure tenant id.

      openbao_seal_azurekeyvault_vault_name:
        type: str
        required: false
        default: ""
        description: Azure Key Vault name.

      openbao_seal_azurekeyvault_key_name:
        type: str
        required: false
        default: ""
        description: Key name in the Azure Key Vault.

      openbao_seal_azurekeyvault_client_id:
        type: str
        required: false
        default: ""
        description: Client id of the service principal; empty uses the managed identity.

      openbao_seal_azurekeyvault_client_secret:
        type: str
        required: false
        default: ""
        no_log: true
        description: Client secret of the service principal.

      openbao_seal_gcpckms_project:
        type: str
        required: false
        default: ""
        description: GCP project id.

      openbao_seal_gcpckms_region:
        type: str
        required: false
        default: ""
        description: Key ring location (for example 'global'), not a compute region.

      openbao_seal_gcpckms_key_ring:
        type: str
        required: false
        default: ""
        description: GCP Cloud KMS key ring name.

      openbao_seal_gcpckms_crypto_key:
        type: str
        required: false
        default: ""
        description: GCP Cloud KMS crypto key name.

      openbao_seal_gcpckms_credentials:
        type: str
        required: false
        default: ""
        description: >
          Path on the node to a credentials JSON file (operator-managed secret
          file); empty uses the instance identity.

      openbao_seal_plugin_version:
        type: str
        required: false
        default: "0.1.1"
        description: >
          Release version of the KMS plugin (kms-<provider>-v<version> in
          openbao/openbao-plugins).

      openbao_seal_plugin_base_url:
        type: str
        required: false
        default: "https://github.com/openbao/openbao-plugins/releases/download"
        description: Base URL for KMS plugin archives.

      openbao_seal_plugin_checksum:
        type: str
        required: false
        default: ""
        description: >
          Optional pinned SHA-256 of the extracted plugin binary for this host's
          architecture; also rendered as sha256sum in the plugin stanza.

      # ---- Init / unseal ----
      openbao_init:
        type: bool
        required: false
        default: true
        description: Initialize the cluster when every node reports not initialized.

      openbao_unseal:
        type: bool
        required: false
        default: true
        description: Unseal Shamir nodes with the stored keys (bootstrap, re-runs, rolling restarts).

      openbao_init_key_shares:
        type: int
        required: false
        default: 5
        description: Shamir key shares.

      openbao_init_key_threshold:
        type: int
        required: false
        default: 3
        description: Shamir key threshold.

      openbao_init_recovery_shares:
        type: int
        required: false
        default: 5
        description: Recovery key shares (auto-unseal seals).

      openbao_init_recovery_threshold:
        type: int
        required: false
        default: 3
        description: Recovery key threshold (auto-unseal seals).

      openbao_init_bootstrap_node:
        type: str
        required: false
        default: "{{ openbao_raft_peers | first | default('') }}"
        description: Inventory name of the node that runs operator init.

      openbao_init_pgp_keys:
        type: list
        elements: str
        required: false
        default: []
        description: >
          PGP public keys (paths on the bootstrap node or keybase names) that
          wrap the shares, one per share. With Shamir this requires
          openbao_unseal false.

      openbao_init_output_path:
        type: str
        required: false
        default: "{{ '~/.openbao' | expanduser }}/.openbao_init_{{ openbao_cluster_id }}.json"
        description: >
          Controller-side file for the init output, by default in the
          controller user's home. Pipelines must point it at persistent,
          access-controlled storage.

      openbao_init_encrypt_output:
        type: bool
        required: false
        default: true
        description: Encrypt the init output file with Ansible Vault.

      openbao_init_encrypt_password_file:
        type: str
        required: false
        default: ""
        description: >
          Controller-side plain-text password file used to encrypt the init
          output and to read it back. Required when openbao_init and
          openbao_init_encrypt_output are true.

      openbao_cluster_id:
        type: str
        required: false
        default: "{{ openbao_raft_peers | sort | first | default('') }}"
        description: >
          Stable id used in the init file name; sorted so that reordering the
          inventory does not change it. Set it explicitly in production.

      # ---- Telemetry / logging / TTLs / hardening ----
      openbao_telemetry_enabled:
        type: bool
        required: false
        default: true
        description: Render the telemetry stanza.

      openbao_telemetry_prometheus_retention_time:
        type: str
        required: false
        default: "24h"
        description: Prometheus retention time.

      openbao_telemetry_disable_hostname:
        type: bool
        required: false
        default: true
        description: Do not prefix metrics with the hostname.

      openbao_telemetry_unauthenticated_metrics_access:
        type: bool
        required: false
        default: false
        description: >
          Allow unauthenticated /v1/sys/metrics on the API listener (needed to
          scrape standby nodes).

      openbao_log_level:
        type: str
        required: false
        default: "info"
        choices: [trace, debug, info, warn, error]
        description: OpenBao log level.

      openbao_log_format:
        type: str
        required: false
        default: "json"
        choices: [standard, json]
        description: OpenBao log format.

      openbao_default_lease_ttl:
        type: str
        required: false
        default: "1h"
        description: Default lease TTL (upstream default is 768h).

      openbao_max_lease_ttl:
        type: str
        required: false
        default: "24h"
        description: Maximum lease TTL (upstream default is 768h).

      openbao_enable_file_permissions_check:
        type: bool
        required: false
        default: true
        description: Set BAO_ENABLE_FILE_PERMISSIONS_CHECK=true in openbao.env.

      openbao_extra_config_hcl:
        type: str
        required: false
        default: ""
        description: >
          Raw HCL appended verbatim to openbao.hcl. Must not contain secrets,
          disable_mlock or an initialize stanza; not covered by the audit guard.

      # ---- Audit ----
      openbao_audit_enabled:
        type: bool
        required: false
        default: true
        description: >
          Declare a file audit device in the config. Setting it to false later
          removes the device.

      openbao_audit_path:
        type: str
        required: false
        default: "file"
        description: Mount path of the audit device; immutable once applied.

      openbao_audit_file_path:
        type: str
        required: false
        default: "{{ openbao_audit_dir }}/openbao_audit.log"
        description: Audit log file inside openbao_audit_dir; immutable once applied.

      openbao_audit_file_mode:
        type: str
        required: false
        default: "0600"
        description: Mode OpenBao sets on the audit log file; immutable once applied.

      openbao_audit_options:
        type: dict
        required: false
        default: {}
        description: >
          Extra audit device options (string values, no file_path or mode);
          immutable once applied.

      openbao_audit_logrotate_enabled:
        type: bool
        required: false
        default: true
        description: Install a logrotate rule for the audit log.

      openbao_audit_logrotate_rotate:
        type: int
        required: false
        default: 30
        description: Number of daily audit log rotations to keep.

      # ---- systemd / permissions ----
      openbao_systemd_hardening:
        type: bool
        required: false
        default: true
        description: >
          Add the role's sandboxing directives on top of the upstream unit. Set
          false if a directive conflicts with your environment.

      openbao_systemd_restart_sec:
        type: int
        required: false
        default: 5
        description: RestartSec of the unit (seconds).

      openbao_systemd_timeout_stop_sec:
        type: int
        required: false
        default: 30
        description: TimeoutStopSec of the unit (seconds).

      openbao_tls_key_mode:
        type: str
        required: false
        default: "0640"
        description: Mode of the TLS private key file (owner root:<openbao_group>).

      openbao_tls_cert_mode:
        type: str
        required: false
        default: "0644"
        description: Mode of the TLS certificate and CA files.

      openbao_manage_selinux:
        type: bool
        required: false
        default: true
        description: Run restorecon on the role's directories on EL when SELinux is enabled.

      # ---- Service control ----
      openbao_service_enabled:
        type: bool
        required: false
        default: true
        description: Enable openbao.service at boot.

      openbao_service_state:
        type: str
        required: false
        default: "started"
        choices: [started, stopped]
        description: >
          Desired service state. With stopped the init, unseal and restart
          stages are skipped and a pending restart waits for the next start.

      openbao_restart_health_timeout:
        type: int
        required: false
        default: 300
        description: >
          Seconds to wait for a restarted node to be unsealed and to see a
          leader before the rolling restart aborts.

      openbao_config_only:
        type: bool
        required: false
        default: false
        description: >
          Render-only mode: skip install, guards, service, init, unseal and
          restart; handlers are no-ops. Used by the 'render' Molecule scenario.
